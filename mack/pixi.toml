[workspace]
name = "mack2024-env"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
cudatoolkit = "11.8.*"
pip = "*"

[pypi-dependencies]
tensorflow = "==2.13.0"
nvidia-cudnn-cu11 = "==8.6.0.163"
nvidia-cuda-nvcc-cu11 = "==11.8.89"
keras = "*"
pandas = ">=2.0.0"
tqdm = "*"
numpy = ">=1.23.5"
matplotlib = "*"
scipy = "*"
seaborn = "*"
pandapower = "*"
scikit-learn = "*"
openpyxl = "*"
pydot = "*"
scikeras = "*"

[activation.env]
TF_CPP_MIN_LOG_LEVEL = "1"

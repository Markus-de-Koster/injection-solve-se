coherent: # ------- composed sequences (pgl.data.scenarios.CoherentSpectrumConfig) -------
  name: coherent
  selector: {component: generator, ids: null, consumer_type: null}
  orders: [3]
  n_steps: 1
  n_scenarios: 1
  n_modes: 2
  seed: 0
  mag_distribution: {kind: uniform, low: 0.0, high: 1.0}
  harmonic_reference: iec61000-3-2
  emission_class: auto
  phase_distribution: {kind: normal, loc: 0.0, scale: 32.5}
  jitter_mag: 0.05
  jitter_phase_deg: 5.0
  ar1_rho: 0.8
  dwell: 0.9
  step_size_s: 900.0
  resample_modes_per_scenario: false
  mode_bank_seed: null
  parameters:
  - name: load_scale
    selector: {component: load, ids: null, consumer_type: null}
    distribution: {kind: uniform, low: 0.0, high: 1.0}
    field: pq
    mode: scale
    per: each
    correlation: {factor: demand, rho: 0.5}
    symmetry: small_imbalance
    imbalance: 0.15
    orders: null
    harmonic_reference: null
    emission_class: auto
  - name: pv_scale
    selector: {component: generator, ids: null, consumer_type: null}
    distribution: {kind: uniform, low: 0.0, high: 1.0}
    field: pq
    mode: scale
    per: shared
    correlation: null
    symmetry: balanced
    imbalance: 0.0
    orders: null
    harmonic_reference: null
    emission_class: auto
  - name: source_scale
    selector: {component: source, ids: null, consumer_type: null}
    distribution: {kind: normal, loc: 1.0, scale: 0.0333}
    field: u_ref
    mode: scale
    per: shared
    correlation: null
    symmetry: balanced
    imbalance: 0.0
    orders: null
    harmonic_reference: null
    emission_class: auto
  factors:
  - {name: demand}
  profile:
    selector: {component: generator, ids: null, consumer_type: null}
    daily_amplitude: 1.0
    level_min: 0.85
    level_max: 1.15
    amplitude_jitter_min: 0.8
    amplitude_jitter_max: 1.2
    phase_offset_hours: 1.0
    behavioral_coupling: 0.3
    cloud_coupling: 0.5
    weekend_contrast: 0.15
    seasonal_amplitude: 0.15
    seasonal_peak_doy: 15.0
    pv_seasonal_amplitude: 0.4
    pv_seasonal_peak_doy: 172.0
    pv_daylight_hours: 12.0
    pv_daylight_swing: 4.0
    short_rho: 0.9
    short_sigma: 0.05
  composition:
    selector: null
    classes:
    - name: base_linear
      sign: 1
      rated_power_w: [150.0, 1500.0]
      power_factor: 0.97
      harmonic_magnitude: {}
      emission_class: null
      harmonic_phase_deg: {}
      gamma: [0.0, 0.0]
      phase_slope_deg: [0.0, 0.0]
      emission_floor: [0.0, 0.0]
      emission_floor_phase_deg: [0.0, 0.0]
      activity_preset: household
      discrete_activity: false
      on_off_dwell: [0.85, 0.98]
      loading_min: 0.3
      loading_mean: [0.6, 1.0]
      loading_jitter: 0.05
      loading_rho: 0.85
      states: []
      state_dwell: [0.85, 0.97]
    - name: electronics_smps

# Per-sample aggregate power quality (max over the energized non-neutral rows of a sample).
# No central value is stated for the THD: unlike a per-device emission fraction it is a
# property of the NETWORK and of the solved order set (a stiff feeder excited at two orders
# lands an order of magnitude below the same recipe on a soft feeder over twenty), so a
# single p50 would fail honest datasets. Fill p50 / p95 in from a campaign on the feeder the
# datasets model — on CIGRE LV the calibrated preset reproduces a median near 3.2 % and a
# p99 near 5.8 %.
thd_pct:
  all: {hard_max: 8.0, source: standard, note: DIN EN 50160 total harmonic distortion}
vuf_pct:
  all: {hard_max: 2.0, source: standard, note: DIN EN 50160 voltage unbalance}
vdev_pct:
  all: {hard_max: 10.0, source: standard, note: DIN EN 50160 +/-10 % supply voltage}

[workspace]
name = "se-ablation"
version = "1.0.0"
description = "Reproduction of an injection-domain harmonic state estimation study"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

# Two environments: `cpu` (no GPU needed; data generation, evaluation, figures, tests) and
# `default` (CUDA; training at the paper's sizes).
[environments]
cpu = ["cpu"]
default = ["gpu"]

[dependencies]
python = ">=3.13.12,<3.14"
polars = ">=1.39.3,<2"
pyarrow = ">=20.0.0,<24"
mlflow = ">=3.10.1,<4"
lightning = ">=2.6.1,<3"
pydantic = ">=2.12.5,<3"
pyyaml = ">=6,<7"
torch-geometric = "*"
power-grid-model = ">=1.13.94,<2"
matplotlib = ">=3.11.0,<4"
networkx = ">=3.6.1,<4"
plotly = ">=5,<7"
typing_extensions = ">=4.16,<5"
tqdm = ">=4.68,<5"
pandas = ">=2.3,<3"
scipy = ">=1.18,<2"
numpy = ">=2.2,<2.5"
packaging = ">=26.0,<27"
pytest = ">=9.0.3,<10"
ruff = ">=0.15.17,<0.16"

[pypi-dependencies]
# the one external package of the study, pinned to the commit of its 0.6.0 release
power-grid-ml = { git = "https://github.com/power-grid-ml/pgml.git", rev = "21fcafc71c0550ab2c4f4f914a7a7ba81397f877", extras = ["scenarios", "convert", "viz"] }
# pandapower comes from PyPI (the conda-forge package cannot be solved for python 3.13)
pandapower = ">=3.5.4, <4"
se-ablation = { path = ".", editable = true }

[feature.cpu.dependencies]
pytorch-cpu = ">=2.10.0,<3"

[feature.gpu.system-requirements]
cuda = "12.4"

[feature.gpu.dependencies]
cuda-version = ">=12.9,<13"
pytorch-gpu = ">=2.10.0,<3"

[activation.env]
MLFLOW_ALLOW_FILE_STORE = "true"

[tasks]
reproduce = "python -m se_ablation.reproduce"
test = "python -m pytest -q tests -m 'not slow and not gpu'"
check-vendored = "python tools/check_vendored.py"
